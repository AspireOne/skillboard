<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skillboard</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M14.4 21.2a1.6 1.6 0 0 0-1.1-1.1l-4.6-1.2a.4.4 0 0 1 0-.8l4.6-1.2a1.6 1.6 0 0 0 1.1-1.1l1.2-4.6a.4.4 0 0 1 .8 0l1.2 4.6a1.6 1.6 0 0 0 1.1 1.1l4.6 1.2a.4.4 0 0 1 0 .8l-4.6 1.2a1.6 1.6 0 0 0-1.1 1.1l-1.2 4.6a.4.4 0 0 1-.8 0z" transform="translate(0 -2.4)"/></svg>
        <span>Skillboard</span>
        <div class="theme-switch" id="theme-switch"></div>
      </div>
      <button class="search-trigger" id="search-trigger">
        <span class="icon" data-icon="search"></span>
        <span>Search</span>
        <kbd>Ctrl K</kbd>
      </button>
      <nav id="nav"></nav>
    </aside>
    <main id="main"></main>
  </div>
  <div id="toasts"></div>
  <div id="tooltip" role="tooltip" hidden></div>
</body>
</html>
